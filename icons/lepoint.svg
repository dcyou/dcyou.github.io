<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="steel" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#f1f5f9" />
      <stop offset="0.45" stop-color="#94a3b8" />
      <stop offset="1" stop-color="#475569" />
    </radialGradient>
    <radialGradient id="jack" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fca5a5" />
      <stop offset="0.55" stop-color="#ef4444" />
      <stop offset="1" stop-color="#b91c1c" />
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#7c2d12" stop-opacity="0.35" />
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#vig)" />

  <!-- traits de mesure vers le cochonnet -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="256" x2="150" y2="150" />
    <line x1="256" y1="256" x2="372" y2="196" />
    <line x1="256" y1="256" x2="196" y2="372" />
  </g>

  <!-- viseur centré sur le cochonnet -->
  <circle cx="256" cy="256" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="8" />

  <!-- boules (acier) -->
  <circle cx="150" cy="150" r="40" fill="url(#steel)" stroke="#0f172a" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="372" cy="196" r="40" fill="url(#steel)" stroke="#0f172a" stroke-opacity="0.35" stroke-width="3" />
  <circle cx="196" cy="372" r="40" fill="url(#steel)" stroke="#0f172a" stroke-opacity="0.35" stroke-width="3" />

  <!-- cochonnet au centre -->
  <circle cx="256" cy="256" r="30" fill="url(#jack)" stroke="#7f1d1d" stroke-width="3" />
</svg>
