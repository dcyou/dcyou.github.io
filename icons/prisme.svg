<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Prisme">
  <!--
    Icone de Prisme : une gemme taillee, six facettes autour d'une table.
    C'est la marque du produit (« six facettes, une lumiere »), redessinee a
    l'identique depuis Prisme/public/icon.svg. Silhouette hexagonale fermee,
    donc lisible a 48 px comme a 512. Les six teintes sont celles des six
    facettes du portrait, posees dans un ordre non spectral et a deux opacites
    qui alternent : deux facettes voisines se lisent comme deux plans d'une
    taille, jamais comme un arc de couleurs.
  -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.95" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#070a1f" />

  <!-- La lueur qui pose la gemme sur la nuit. -->
  <circle cx="256" cy="256" r="216" fill="url(#halo)" />

  <!-- Les six facettes de la couronne, dans un ordre non spectral. -->
  <g>
    <path d="M256 76 L412 166 L325 216 L256 176 Z" fill="#fb7185" opacity="0.62" />
    <path d="M412 166 L412 346 L325 296 L325 216 Z" fill="#34d399" opacity="0.44" />
    <path d="M412 346 L256 436 L256 336 L325 296 Z" fill="#fb923c" opacity="0.62" />
    <path d="M256 436 L100 346 L187 296 L256 336 Z" fill="#38bdf8" opacity="0.44" />
    <path d="M100 346 L100 166 L187 216 L187 296 Z" fill="#facc15" opacity="0.62" />
    <path d="M100 166 L256 76 L256 176 L187 216 Z" fill="#a78bfa" opacity="0.44" />
  </g>

  <!-- La table : la lumiere unique, au centre des six. -->
  <path d="M256 176 L325 216 L325 296 L256 336 L187 296 L187 216 Z" fill="url(#table)" />

  <!-- Les aretes de la taille. -->
  <g fill="none" stroke="#c4b5fd" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 76 L412 166 L412 346 L256 436 L100 346 L100 166 Z" stroke-width="13" />
    <path d="M256 176 L325 216 L325 296 L256 336 L187 296 L187 216 Z" stroke-width="9" />
    <g stroke-width="7">
      <path d="M256 76 L256 176" />
      <path d="M412 166 L325 216" />
      <path d="M412 346 L325 296" />
      <path d="M256 436 L256 336" />
      <path d="M100 346 L187 296" />
      <path d="M100 166 L187 216" />
    </g>
  </g>
</svg>
